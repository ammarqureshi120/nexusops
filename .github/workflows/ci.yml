name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://nexusops:nexusops_test@localhost:5432/nexusops_test?schema=public
      SESSION_HASH_SECRET: ci-only-session-secret-that-is-long-enough
      TEST_DATABASE_URL: postgresql://nexusops:nexusops_test@localhost:5432/nexusops_test?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexusops_test
          POSTGRES_USER: nexusops
          POSTGRES_PASSWORD: nexusops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusops -d nexusops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: corepack pnpm db:generate

      - name: Validate database schema
        run: corepack pnpm --filter @nexusops/api prisma:validate

      - name: Apply database migrations
        run: corepack pnpm --filter @nexusops/api exec prisma migrate deploy

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
